name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: aegis_db
          POSTGRES_USER: aegis_user
          POSTGRES_PASSWORD: secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://aegis_user:secure_password@localhost:5432/aegis_db
        run: |
          pytest -q
      - name: Run frontend build
        run: |
          cd frontend
          npm run build
      - name: Build Docker images
        run: |
          docker build -f Dockerfile.backend -t aegis-backend:ci .
          docker build -f frontend/Dockerfile -t aegis-frontend:ci ./frontend
